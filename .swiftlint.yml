# Safety and complexity only. Formatting belongs to swift-format.
only_rules:
  - force_unwrapping
  - force_try
  - force_cast
  - implicitly_unwrapped_optional
  - weak_delegate
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - type_body_length

cyclomatic_complexity:
  warning: 12
  error: 20

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

excluded:
  - build
  - Derived
  - Tuist/.build
  - .tuist
  - Sidekick.xcodeproj
  - Sidekick.xcworkspace
