name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  verify:
    name: Verify
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: Tuist/.build
          key: spm-${{ hashFiles('Tuist/Package.resolved') }}

      - name: Signing fallback
        run: scripts/setup-signing.sh

      - name: Version
        run: scripts/version.sh

      - name: Generate project
        run: mise exec -- tuist install && mise exec -- tuist generate --no-open

      - name: Format
        run: xcrun swift-format lint --strict --recursive --parallel Apps Core Features Tuist Project.swift Tuist.swift

      - name: SwiftLint
        run: mise exec -- swiftlint lint --strict --quiet

      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace Sidekick.xcworkspace \
            -scheme Sidekick \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath build/Sidekick.xcresult \
            test \
            | mise exec -- xcbeautify --renderer github-actions --report junit --report-path build/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: build/junit.xml
          if-no-files-found: ignore
